<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4f7;color:#19161b;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding-bottom:100px}
.hero{background:#17131a;color:#fff;padding:22px 14px 14px;position:sticky;top:0;z-index:8}.kicker{font-size:11px;letter-spacing:.18em;color:#d5aecf;font-weight:900}h1{font-size:22px;margin:5px 0}.sub{font-size:12px;color:#ccc6ce}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.filter,.clear{border:1px solid #5d5660;background:#242027;color:#fff;border-radius:12px;padding:9px 4px;font-size:12px;font-weight:800}.filter.active{background:#8b3e89;border-color:#a55aa3}.clear{grid-column:1/-1;padding:7px}
main{padding:16px 11px}.sectionTitle{font-size:18px;font-weight:900;margin:0 2px 11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{background:#fff;border-radius:17px;overflow:hidden;box-shadow:0 3px 14px #0000000b;position:relative}.visual{height:112px;background:linear-gradient(145deg,#f0ebf2,#faf9fb);display:flex;align-items:center;justify-content:center}.visual svg{width:82px;height:82px;stroke:#332c35;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.new{position:absolute;left:8px;top:8px;background:#ff4059;color:#fff;border-radius:8px;padding:4px 7px;font-size:9px;font-weight:900}.body{padding:10px}.name{font-size:13px;font-weight:900;line-height:1.35;min-height:38px}.priceRow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:5px 0 8px}.price{font-size:19px;font-weight:950}.limit{font-size:9px;color:#a91f36;background:#fff0f2;border:1px solid #efbac2;border-radius:999px;padding:3px 5px;font-weight:900}
.qty{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;text-align:center;border:1px solid #e1dce3;border-radius:10px;overflow:hidden}.qty button{border:0;background:#f1edf2;color:#211d22;font-size:20px;height:34px;font-weight:800}.qty b{font-size:15px}
.phase,.note{margin-top:15px;background:#fff;border:1px solid #e4dce6;border-left:5px solid #8b3e89;border-radius:13px;padding:12px 13px;font-size:12px;line-height:1.65}.phase strong,.note strong{color:#702a70}.note{margin-bottom:6px;color:#5f5862}
.total{position:fixed;bottom:0;left:0;right:0;background:#17131af3;color:#fff;z-index:10;padding:11px 17px calc(11px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(12px)}.total small{display:block;color:#bbb4bd;font-size:10px}#count{font-weight:800}#sum{font-size:28px;font-weight:950}
@media(min-width:720px){main{max-width:900px;margin:auto}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header class="hero"><div class="kicker">GOODS</div><h1>購入金額チェッカー</h1><div class="sub">欲しいグッズの「＋」を押すと合計金額を自動計算</div>
<div class="filters"><button class="filter active" data-filter="all">すべて</button><button class="filter" data-filter="old">前回グッズ</button><button class="filter" data-filter="new">追加グッズ NEW</button><button class="clear" id="clear">全部解除</button></div></header>
<main><div class="sectionTitle" id="sectionTitle">すべてのグッズ（27商品）</div><div class="grid" id="grid"></div>
<div class="phase" id="phase"></div>
<div class="note"><strong>⚠️ 購入上限</strong><br>ペンライト：1点まで ／ ランダムフォトカード：10点まで ／ Born to Bloom通常商品：各3点まで<br>Members’ Collection：8/29〜30の数量限定EC先行販売は各1点、8/31〜9/4のEC受注販売は各3点。<br><br>※商品はすべて税込価格です。購入時は公式販売ページの最新情報をご確認ください。<br>※イラストは商品を識別しやすくするためのオリジナル簡易アイコンで、実際の商品デザインとは異なります。</div>
</main><footer class="total"><div><small>SELECTED</small><span id="count">0点</span></div><div id="sum">¥0</div></footer>

charm:`<circle fill="${c.purple}" cx="60" cy="58" r="26"/><circle fill="#f4e8f1" cx="60" cy="58" r="15"/><path fill="none" d="M60 32V18"/><circle fill="${c.silver}" cx="60" cy="13" r="5"/>`,
photos:`<rect fill="${c.pink}" x="18" y="24" width="39" height="61" rx="5"/><rect fill="${c.purple}" x="40" y="29" width="39" height="61" rx="5"/><rect fill="${c.rose}" x="62" y="34" width="39" height="61" rx="5"/><path fill="none" stroke="white" d="M70 49h22M70 59h16"/>`,

function tokyoStamp(){
 const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
 const v=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${v.year}-${v.month}-${v.day}T${v.hour}:${v.minute}:${v.second}`;
}
function memberMax(){const n=tokyoStamp();return n>="2026-08-31T20:00:00"&&n<="2026-09-04T23:59:59"?3:1}
let filter="all";
function render(){
 const mm=memberMax();items.forEach(x=>{x.max=x.member?mm:x.baseMax;if(x.qty>x.max)x.qty=x.max});
 const shown=items.filter(x=>filter==="all"||x.group===filter);
 document.getElementById("sectionTitle").textContent=filter==="all"?"すべてのグッズ（27商品）":filter==="old"?"前回グッズ（15商品）":"追加グッズ NEW（12商品）";
 document.getElementById("grid").innerHTML=shown.map((x)=>`<article class="card">${x.group==="new"?'<span class="new">NEW</span>':''}<div class="visual">${svg(x.icon)}</div><div class="body"><div class="name">${x.name}</div><div class="priceRow"><span class="price">¥${x.price.toLocaleString("ja-JP")}</span><span class="limit">⚠️${x.max}点まで</span></div><div class="qty"><button onclick="chg(${items.indexOf(x)},-1)">−</button><b>${x.qty}</b><button onclick="chg(${items.indexOf(x)},1)">＋</button></div></div></article>`).join("");
 const count=items.reduce((a,x)=>a+x.qty,0),sum=items.reduce((a,x)=>a+x.qty*x.price,0);document.getElementById("count").textContent=count+"点";document.getElementById("sum").textContent="¥"+sum.toLocaleString("ja-JP");
 const n=tokyoStamp(),ph=document.getElementById("phase");
 if(n>="2026-08-31T20:00:00"&&n<="2026-09-04T23:59:59")ph.innerHTML="<strong>⚠️ Members’ Collection</strong><br>8/31〜9/4 EC受注販売：<b>各3点まで</b>（自動切替中）";
 else if(n>="2026-08-29T20:00:00"&&n<="2026-08-30T23:59:59")ph.innerHTML="<strong>⚠️ Members’ Collection</strong><br>8/29〜30 数量限定EC先行販売：<b>各1点まで</b>";
 else ph.innerHTML="<strong>⚠️ Members’ Collection</strong><br>8/29〜30：各1点まで ／ 8/31〜9/4：各3点まで<br>販売期間に合わせて自動で切り替わります。";
}
window.chg=(i,d)=>{const x=items[i];x.qty=Math.max(0,Math.min(x.max,x.qty+d));render()};
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});
document.getElementById("clear").onclick=()=>{items.forEach(x=>x.qty=0);render()};render();setInterval(render,60000);
</script></body></html>
