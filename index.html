<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17131a">
<title>GOODS 購入金額チェッカー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4f7;color:#19161b;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding-bottom:112px}
.hero{background:#17131a;color:#fff;padding:23px 15px 15px;position:sticky;top:0;z-index:8}.kicker{font-size:11px;letter-spacing:.18em;color:#d5aecf;font-weight:900}h1{font-size:22px;margin:5px 0}.sub{font-size:12px;color:#ccc6ce}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}button{font:inherit}.filter,.clear{border:1px solid #5d5660;background:#242027;color:#fff;border-radius:12px;padding:9px 4px;font-size:12px;font-weight:800}.filter.active{background:#8b3e89;border-color:#a55aa3}.clear{grid-column:1/-1;padding:7px}
.alert{margin:12px 11px 0;background:#fff4f5;border:1px solid #efc7cc;border-radius:14px;padding:11px 12px;font-size:12px;line-height:1.65}.alert strong{color:#c2263d}
.sectionTitle{padding:17px 13px 2px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:10px 11px}
.card{background:#fff;border-radius:17px;overflow:hidden;box-shadow:0 3px 14px #0000000b}.visual{height:105px;background:linear-gradient(145deg,#eee9f0,#faf9fb);display:flex;align-items:center;justify-content:center;position:relative}.icon{font-size:42px}.new{position:absolute;left:8px;top:8px;background:#ff4059;color:#fff;border-radius:8px;padding:5px 7px;font-size:10px;font-weight:900}
.body{padding:11px}.member{font-size:11px;color:#874680;font-weight:950;letter-spacing:.08em;margin-bottom:3px}.name{font-size:14px;font-weight:900;line-height:1.35;min-height:40px}.priceRow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:5px 0 9px}.price{font-size:20px;font-weight:950}.limit{font-size:10px;font-weight:900;color:#c3263e;background:#fff0f2;border-radius:999px;padding:4px 6px}
.qty{display:grid;grid-template-columns:35px 1fr 35px;align-items:center;text-align:center;border:1px solid #e1dce3;border-radius:10px;overflow:hidden}.qty button{border:0;background:#f1edf2;color:#211d22;font-size:21px;height:35px;font-weight:800}.qty b{font-size:16px}
.card.selected{outline:3px solid #8b3e89}.hidden{display:none!important}.note{padding:4px 13px 16px;color:#77717a;font-size:11px;line-height:1.55}
.total{position:fixed;bottom:0;left:0;right:0;background:#17131af3;color:white;z-index:10;padding:12px 17px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(12px)}.total small{display:block;color:#bbb4bd;font-size:10px}#count{font-weight:800}#sum{font-size:29px;font-weight:950}
</style>
</head>
<body>
<header class="hero">
<div class="kicker">HANA GOODS</div><h1>購入金額チェッカー</h1>
<div class="sub">欲しいグッズの「＋」を押すと合計金額を自動計算</div>
<div class="filters">
<button class="filter active" data-filter="all">すべて</button>
<button class="filter" data-filter="previous">前回グッズ</button>
<button class="filter" data-filter="new">今回追加 NEW</button>
<button class="clear" id="clear">全部解除</button>
</div></header>

<div class="alert"><strong>⚠️ 購入上限</strong><br>
OFFICIAL LIGHT STICK：1点まで<br>
ランダムフォトカード・ステッカーセット：10点まで<br>
Members’ Collection 7商品：各1点まで<br>
その他の商品：各3点まで
</div>

<div class="sectionTitle" id="sectionTitle">すべてのグッズ（27商品）</div>
<main class="grid" id="grid"></main>

<div class="note">※非公式の購入金額計算ツールです。購入上限・商品情報・価格等は公式販売ページを必ずご確認ください。</div>
<footer class="total"><div><small>SELECTED</small><span id="count">0点</span></div><div id="sum">¥0</div></footer>

<script>
const products=[
/* 前回15商品 */
["OFFICIAL LIGHT STICK",6000,"previous",1,"💡",""],
["ペンライトバッグ",3800,"previous",3,"👜",""],
["ロゴパーカー",11000,"previous",3,"👕",""],
["ロゴパンツ",9000,"previous",3,"👖",""],
["Tシャツ GY",5500,"previous",3,"👕",""],
["Tシャツ Rose",5300,"previous",3,"👕",""],
["トートバッグ",3300,"previous",3,"🛍️",""],
["ペンライトストラップ",1000,"previous",3,"🎗️",""],
["ペンライトチャーム",2000,"previous",3,"🌹",""],
["ミラーチャーム",1800,"previous",3,"🪞",""],
["リップポーチ",2000,"previous",3,"💄",""],
["キーホルダー",1500,"previous",3,"🔑",""],
["カードケース",2200,"previous",3,"💳",""],
["タオル",2500,"previous",3,"🧣",""],
["ランダムフォトカード・ステッカーセット",500,"previous",10,"🎴",""],

/* 今回追加：OFFICIAL MERCHANDISE 5商品 */
["ロングスリーブTシャツ",6500,"new",3,"👕",""],
["ソックスセット",2800,"new",3,"🧦",""],
["ベルト",7800,"new",3,"➰",""],
["シュシュ",1800,"new",3,"🌹",""],
["ブランケット",4500,"new",3,"🛏️",""],

/* 今回追加：Members’ Collection 7商品（各1点） */
["ウォレットチェーン",7500,"new",1,"⛓️","CHIKA"],
["リングセット",5500,"new",1,"💍","NAOKO"],
["お弁当箱",7500,"new",1,"🍱","JISOO"],
["ティッシュボックスケース",5500,"new",1,"🧻","YURI"],
["ビーニー",3500,"new",1,"🧢","MOMOKA"],
["ワンショルダーバッグ",5000,"new",1,"🎒","KOHARU"],
["ウォーターボトル",5500,"new",1,"🥤","MAHINA"]
];

const grid=document.getElementById("grid");
products.forEach(([name,price,group,max,icon,member])=>{
 const a=document.createElement("article");
 a.className="card"; a.dataset.group=group; a.dataset.price=price; a.dataset.max=max;
 a.innerHTML=`<div class="visual">${group==="new"?'<span class="new">NEW</span>':""}<span class="icon">${icon}</span></div>
 <div class="body">${member?`<div class="member">${member}</div>`:""}<div class="name">${name}</div>
 <div class="priceRow"><div class="price">¥${price.toLocaleString("ja-JP")}</div><span class="limit">⚠️ ${max}点まで</span></div>
 <div class="qty"><button class="minus" type="button">−</button><b>0</b><button class="plus" type="button">＋</button></div></div>`;
 grid.appendChild(a);
});

const cards=[...document.querySelectorAll(".card")];
const countEl=document.getElementById("count"),sumEl=document.getElementById("sum");
function calc(){
 let count=0,sum=0;
 cards.forEach(c=>{const q=+c.querySelector(".qty b").textContent;count+=q;sum+=q*(+c.dataset.price);c.classList.toggle("selected",q>0)});
 countEl.textContent=count+"点";sumEl.textContent="¥"+sum.toLocaleString("ja-JP");
}
cards.forEach(c=>{
 const q=c.querySelector(".qty b");
 c.querySelector(".plus").onclick=()=>{let n=+q.textContent,max=+c.dataset.max;if(n<max)q.textContent=n+1;calc()};
 c.querySelector(".minus").onclick=()=>{let n=+q.textContent;if(n>0)q.textContent=n-1;calc()};
});
document.getElementById("clear").onclick=()=>{cards.forEach(c=>c.querySelector(".qty b").textContent=0);calc()};
document.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
 const f=btn.dataset.filter;cards.forEach(c=>c.classList.toggle("hidden",f!=="all"&&c.dataset.group!==f));
 document.getElementById("sectionTitle").textContent=f==="all"?"すべてのグッズ（27商品）":f==="previous"?"前回グッズ（15商品）":"今回追加グッズ（12商品）";
});
calc();
</script>
</body></html>
