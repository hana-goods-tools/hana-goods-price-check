<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17131a">
<title>HANA GOODS CALCULATOR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f4f7;color:#19161b;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding-bottom:115px}
.hero{background:#17131a;color:white;padding:25px 17px 16px;position:sticky;top:0;z-index:5}
.kicker{font-size:11px;letter-spacing:.18em;color:#c8a9cf;font-weight:800}
h1{font-size:23px;margin:5px 0 4px;letter-spacing:.02em}
.sub{font-size:12px;color:#c9c5ca}
.actions{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid #514b53;background:transparent;color:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:12px}
button.active{background:#783887;border-color:#783887}
.section-title{padding:17px 14px 3px;font-size:15px;font-weight:900;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:10px 12px 12px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 14px #0000000c;position:relative;display:block}
.card input{position:absolute;opacity:0;pointer-events:none}
.icon{height:115px;background:linear-gradient(145deg,#eee9f0,#faf9fb);display:flex;align-items:center;justify-content:center;font-size:49px;position:relative}
.check{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:2px solid #d9d3dc;background:#fff;color:transparent;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.card:has(input:checked){outline:3px solid #783887}
.card input:checked + .icon{background:linear-gradient(145deg,#eaddef,#f8f3fa)}
.card input:checked + .icon .check{background:#783887;border-color:#783887;color:#fff}
.content{padding:10px 12px 13px}
.member{font-size:10px;color:#7c4387;letter-spacing:.09em;font-weight:900;height:14px}
.name{font-size:13px;line-height:1.3;font-weight:750;min-height:34px;margin-top:2px}
.price{font-size:18px;font-weight:900;margin-top:4px}
.total{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#17131af2;color:#fff;padding:13px 18px calc(13px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(12px)}
.total small{display:block;font-size:10px;color:#bbb6bd;letter-spacing:.08em}
#count{font-size:15px;font-weight:800} #sum{font-size:29px;font-weight:950}
.note{padding:5px 14px 14px;font-size:11px;color:#89848b;line-height:1.5}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="hero">
<div class="kicker">HANA GOODS</div>
<h1>購入金額 CALCULATOR</h1>
<div class="sub">欲しいグッズをタップすると、すべてまとめて合計金額を自動計算</div>
<div class="actions">
<button class="filter active" data-filter="all">すべて</button>
<button class="filter" data-filter="regular">通常グッズ</button>
<button class="filter" data-filter="bloom">Born to Bloom</button>
<button id="alloff">全部解除</button>
</div>
</header>

<section class="goods-section" data-section="regular">
<div class="section-title">通常グッズ</div>
<main class="grid">
<label class="card"><input type="checkbox" data-price="7500"><div class="icon">⛓️<span class="check">✓</span></div><div class="content"><div class="member">CHIKA</div><div class="name">Wallet chain</div><div class="price">¥7,500</div></div></label>
<label class="card"><input type="checkbox" data-price="5500"><div class="icon">💍<span class="check">✓</span></div><div class="content"><div class="member">NAOKO</div><div class="name">Ring set</div><div class="price">¥5,500</div></div></label>
<label class="card"><input type="checkbox" data-price="7500"><div class="icon">🍱<span class="check">✓</span></div><div class="content"><div class="member">JISOO</div><div class="name">Bento box</div><div class="price">¥7,500</div></div></label>
<label class="card"><input type="checkbox" data-price="5500"><div class="icon">🧻<span class="check">✓</span></div><div class="content"><div class="member">YURI</div><div class="name">Tissue box case</div><div class="price">¥5,500</div></div></label>
<label class="card"><input type="checkbox" data-price="3500"><div class="icon">🧢<span class="check">✓</span></div><div class="content"><div class="member">MOMOKA</div><div class="name">Beanie</div><div class="price">¥3,500</div></div></label>
<label class="card"><input type="checkbox" data-price="5000"><div class="icon">🎒<span class="check">✓</span></div><div class="content"><div class="member">KOHARU</div><div class="name">One-strap backpack</div><div class="price">¥5,000</div></div></label>
<label class="card"><input type="checkbox" data-price="5500"><div class="icon">🥤<span class="check">✓</span></div><div class="content"><div class="member">MAHINA</div><div class="name">Water bottle</div><div class="price">¥5,500</div></div></label>
<label class="card"><input type="checkbox" data-price="6500"><div class="icon">👕<span class="check">✓</span></div><div class="content"><div class="member">&nbsp;</div><div class="name">ロングスリーブTシャツ</div><div class="price">¥6,500</div></div></label>
<label class="card"><input type="checkbox" data-price="2800"><div class="icon">🧦<span class="check">✓</span></div><div class="content"><div class="member">&nbsp;</div><div class="name">ソックスセット</div><div class="price">¥2,800</div></div></label>
<label class="card"><input type="checkbox" data-price="7800"><div class="icon">🖤<span class="check">✓</span></div><div class="content"><div class="member">&nbsp;</div><div class="name">ベルト</div><div class="price">¥7,800</div></div></label>
<label class="card"><input type="checkbox" data-price="1800"><div class="icon">🎀<span class="check">✓</span></div><div class="content"><div class="member">&nbsp;</div><div class="name">シュシュ</div><div class="price">¥1,800</div></div></label>
<label class="card"><input type="checkbox" data-price="4500"><div class="icon">🛏️<span class="check">✓</span></div><div class="content"><div class="member">&nbsp;</div><div class="name">ブランケット</div><div class="price">¥4,500</div></div></label>
<label class="card"><input type="checkbox" data-price="6000"><div class="icon">💡<span class="check">✓</span></div><div class="content"><div class="member">&nbsp;</div><div class="name">OFFICIAL LIGHT STICK</div><div class="price">¥6,000</div></div></label>
</main>
</section>

<section class="goods-section" data-section="bloom">
<div class="section-title">Born to Bloom</div>
<main class="grid">
<label class="card"><input type="checkbox" data-price="3800"><div class="icon">👜<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">ペンライトバッグ</div><div class="price">¥3,800</div></div></label>
<label class="card"><input type="checkbox" data-price="11000"><div class="icon">🧥<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">ロゴパーカー</div><div class="price">¥11,000</div></div></label>
<label class="card"><input type="checkbox" data-price="9000"><div class="icon">👖<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">ロゴパンツ</div><div class="price">¥9,000</div></div></label>
<label class="card"><input type="checkbox" data-price="1000"><div class="icon">🎗️<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">ペンライトストラップ</div><div class="price">¥1,000</div></div></label>
<label class="card"><input type="checkbox" data-price="2000"><div class="icon">🌹<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">ペンライトチャーム</div><div class="price">¥2,000</div></div></label>
<label class="card"><input type="checkbox" data-price="500"><div class="icon">📸<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">ランダムフォトカード・ステッカーセット</div><div class="price">¥500</div></div></label>
<label class="card"><input type="checkbox" data-price="1800"><div class="icon">🪞<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">ミラーチャーム</div><div class="price">¥1,800</div></div></label>
<label class="card"><input type="checkbox" data-price="2000"><div class="icon">💄<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">リップポーチ</div><div class="price">¥2,000</div></div></label>
<label class="card"><input type="checkbox" data-price="2200"><div class="icon">💳<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">カードケース</div><div class="price">¥2,200</div></div></label>
<label class="card"><input type="checkbox" data-price="1500"><div class="icon">🔑<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">キーホルダー</div><div class="price">¥1,500</div></div></label>
<label class="card"><input type="checkbox" data-price="2500"><div class="icon">🧣<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">タオル</div><div class="price">¥2,500</div></div></label>
<label class="card"><input type="checkbox" data-price="5500"><div class="icon">👕<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">Tシャツ GY</div><div class="price">¥5,500</div></div></label>
<label class="card"><input type="checkbox" data-price="5300"><div class="icon">🌹<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">Tシャツ Rose</div><div class="price">¥5,300</div></div></label>
<label class="card"><input type="checkbox" data-price="3300"><div class="icon">🛍️<span class="check">✓</span></div><div class="content"><div class="member">BORN TO BLOOM</div><div class="name">トートバッグ</div><div class="price">¥3,300</div></div></label>
</main>
</section>

<div class="note">※非公式の購入金額計算ツールです。商品名・価格は変更される場合があります。</div>
<footer class="total"><div><small>SELECTED</small><span id="count">0 items</span></div><div id="sum">¥0</div></footer>
<script>
const boxes=[...document.querySelectorAll('input[type="checkbox"]')];
function calc(){
 const selected=boxes.filter(b=>b.checked);
 const sum=selected.reduce((n,b)=>n+Number(b.dataset.price),0);
 document.getElementById('count').textContent=selected.length+' items';
 document.getElementById('sum').textContent='¥'+sum.toLocaleString('ja-JP');
}
boxes.forEach(b=>b.addEventListener('change',calc));
document.getElementById('alloff').onclick=()=>{boxes.forEach(b=>b.checked=false);calc()};
document.querySelectorAll('.filter').forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  const f=btn.dataset.filter;
  document.querySelectorAll('.goods-section').forEach(sec=>{
   sec.classList.toggle('hidden',f!=='all' && sec.dataset.section!==f);
  });
 };
});
calc();
</script>
</body>
</html>
