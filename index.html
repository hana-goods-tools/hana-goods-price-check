<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HANA グッズ金額計算</title>
<style>
:root{--bg:#0d0d0f;--card:#18181b;--line:#34343a;--text:#f8f8f8;--sub:#b9b9c0;--red:#c92032}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}
main{max-width:1000px;margin:auto;padding:22px 14px 120px}
h1{font-size:27px;margin:5px 0}.lead{color:var(--sub);margin:4px 0 20px}
.notice{border:1px solid #6b2b31;background:#211316;border-radius:16px;padding:15px;margin:0 0 22px;line-height:1.7}
.notice b{color:#ff6b79}.section{margin:28px 0 12px}.section h2{font-size:21px;margin:0 0 5px}.section p{color:var(--sub);margin:0 0 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;display:grid;grid-template-columns:70px 1fr;gap:11px;align-items:center}
.art{width:70px;height:70px;border-radius:13px;background:#242428;display:flex;align-items:center;justify-content:center}
.art svg{width:58px;height:58px;fill:none;stroke:#eee;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.name{font-weight:750;line-height:1.35}.price{font-size:14px;color:#d5d5d8;margin-top:4px}.limit{font-size:12px;color:#ff818c;font-weight:700;margin-left:5px}
.controls{display:flex;align-items:center;gap:7px;margin-top:9px}.controls button{width:35px;height:35px;border:1px solid #4a4a50;background:#29292e;color:white;border-radius:9px;font-size:20px}.qty{min-width:27px;text-align:center;font-weight:800}
.totalbar{position:fixed;left:0;right:0;bottom:0;background:rgba(12,12,14,.96);border-top:1px solid #3a3a3e;padding:13px 16px calc(13px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
.totalin{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center}.total{font-size:25px;font-weight:900}.reset{border:1px solid #555;background:#222;color:white;border-radius:10px;padding:9px 13px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.item{grid-template-columns:64px 1fr}.art{width:64px;height:64px}.art svg{width:52px;height:52px}}
</style>
</head>
<body><main>
<h1>HANA グッズ金額計算</h1>
<p class="lead">欲しいグッズの数量を選ぶだけで合計金額を計算できます。</p>
<div class="notice"><b>⚠️ 購入制限について</b><br>
商品ごとに数量上限を設定しています。各商品の金額横に「⚠️1点まで」などを表示しています。<br>
※このページのイラストは商品を識別しやすくするための独自の簡略アイコンです。実際の商品デザイン・仕様とは異なります。非公式の計算ツールです。
</div>
<div id="app"></div>
</main>
<div class="totalbar"><div class="totalin"><div>合計 <span class="total" id="total">¥0</span></div><button class="reset" onclick="resetAll()">リセット</button></div></div>
<script>
const icons={
light:`<path d="M50 38C42 29 29 25 29 15C29 6 41 3 50 14C59 3 71 6 71 15C71 25 58 30 50 38Z"/><rect x="44" y="38" width="12" height="45" rx="5"/>`,
bag:`<rect x="23" y="35" width="54" height="48" rx="7"/><path d="M34 35V25C34 10 66 10 66 25V35"/>`,
hoodie:`<path d="M37 18L22 25 11 45 26 52 32 41V85H68V41L74 52 89 45 78 25 63 18"/><path d="M38 18C39 7 45 4 50 4S61 7 62 18C57 24 43 24 38 18Z"/>`,
pants:`<path d="M30 15H70L66 85H52L49 43 45 85H29Z"/><path d="M30 28H69"/>`,
shirt:`<path d="M36 17L18 25 9 44 26 51 32 40V84H68V40L74 51 91 44 82 25 64 17C61 24 56 27 50 27S39 24 36 17Z"/>`,
longshirt:`<path d="M36 17L20 24 7 48 21 55 31 40V85H69V40L79 55 93 48 80 24 64 17C60 24 56 27 50 27S40 24 36 17Z"/>`,
strap:`<path d="M28 76L70 24"/><rect x="21" y="67" width="17" height="12" rx="4" transform="rotate(-50 29 73)"/><circle cx="72" cy="21" r="7"/>`,
charm:`<circle cx="50" cy="51" r="24"/><circle cx="50" cy="51" r="15"/><path d="M50 27V14"/><circle cx="50" cy="10" r="5"/>`,
photo:`<rect x="19" y="13" width="48" height="66" rx="5"/><rect x="34" y="22" width="48" height="66" rx="5"/><circle cx="58" cy="43" r="9"/><path d="M43 72L54 58 62 66 70 55 80 72"/>`,
mirror:`<circle cx="50" cy="47" r="27"/><circle cx="50" cy="47" r="20"/><path d="M50 20V10"/><circle cx="50" cy="7" r="4"/>`,
pouch:`<rect x="28" y="27" width="44" height="61" rx="10"/><path d="M28 43H72"/><path d="M35 27V19H65V27"/>`,
card:`<rect x="18" y="31" width="64" height="47" rx="8"/><path d="M18 48H82"/><path d="M28 60H52"/>`,
key:`<circle cx="50" cy="48" r="23"/><path d="M50 25V14"/><circle cx="50" cy="10" r="6"/><path d="M39 48H61M50 37V59"/>`,
towel:`<rect x="10" y="32" width="80" height="40" rx="5"/><path d="M20 43H80M20 60H80"/>`,
socks:`<path d="M22 13H43V57C43 74 34 84 20 84C12 84 8 79 8 73C8 65 15 60 26 60"/><path d="M57 13H78V57C78 74 69 84 55 84C47 84 43 79 43 73C43 65 50 60 61 60"/>`,
belt:`<path d="M12 43H70V59H12Z"/><rect x="66" y="36" width="25" height="30" rx="3"/><rect x="72" y="42" width="13" height="18" rx="2"/>`,
scrunchie:`<path d="M23 50C10 36 26 22 38 30C42 14 62 14 66 30C80 22 91 38 80 50C91 62 79 79 66 70C62 86 42 86 38 70C24 79 11 63 23 50Z"/><circle cx="52" cy="50" r="13"/>`,
blanket:`<rect x="13" y="20" width="74" height="58" rx="6"/><path d="M13 39H87M32 20V78M68 20V78M17 78V87M27 78V87M37 78V87M47 78V87M57 78V87M67 78V87M77 78V87"/>`,
chain:`<path d="M20 24C25 45 39 63 61 74C70 79 78 75 82 67"/><circle cx="20" cy="20" r="7"/><circle cx="82" cy="64" r="7"/><circle cx="32" cy="45" r="6"/><circle cx="47" cy="61" r="6"/>`,
ring:`<circle cx="38" cy="52" r="22"/><circle cx="65" cy="52" r="22"/><circle cx="38" cy="52" r="14"/><circle cx="65" cy="52" r="14"/>`,
bento:`<rect x="13" y="31" width="74" height="44" rx="20"/><path d="M13 53H87M48 31V75"/>`,
tissue:`<rect x="12" y="44" width="76" height="40" rx="7"/><path d="M35 44C39 35 43 30 50 29C57 30 61 35 65 44"/><path d="M28 57H72"/>`,
beanie:`<path d="M20 63C22 32 33 16 50 16C67 16 78 32 80 63Z"/><rect x="15" y="61" width="70" height="20" rx="7"/>`,
bottle:`<rect x="35" y="27" width="30" height="59" rx="10"/><rect x="40" y="14" width="20" height="14" rx="4"/><path d="M60 18C73 18 75 31 65 36"/>`
};

const sections=[
["前回グッズ",[
["HANA OFFICIAL LIGHT STICK",6000,3,"light"],["HANA ペンライトバッグ",3800,3,"bag"],["HANA ロゴパーカー",11000,3,"hoodie"],["HANA ロゴパンツ",9000,3,"pants"],
["Born to Bloom Tシャツ GY",5500,3,"shirt"],["Born to Bloom Tシャツ Rose",5300,3,"shirt"],["Born to Bloom トートバッグ",3300,3,"bag"],["Born to Bloom ペンライトストラップ",1000,3,"strap"],
["Born to Bloom ペンライトチャーム",2000,3,"charm"],["Born to Bloom ランダムフォトカード・ステッカーセット",500,10,"photo"],["Born to Bloom ミラーチャーム",1800,3,"mirror"],
["Born to Bloom リップポーチ",2000,3,"pouch"],["Born to Bloom カードケース",2200,3,"card"],["Born to Bloom キーホルダー",1500,3,"key"],["Born to Bloom タオル",2500,3,"towel"]
]],
["今回追加グッズ｜OFFICIAL MERCHANDISE",[
["ロングスリーブTシャツ",6500,1,"longshirt"],["ソックスセット",2800,1,"socks"],["ベルト",7800,1,"belt"],["シュシュ",1800,1,"scrunchie"],["ブランケット",4500,1,"blanket"]
]],
["今回追加グッズ｜Members’ Collection",[
["Wallet chain / CHIKA",7500,1,"chain"],["Ring set / NAOKO",5500,1,"ring"],["Bento box / JISOO",7500,1,"bento"],["Tissue box case / YURI",5500,1,"tissue"],
["Beanie / MOMOKA",3500,1,"beanie"],["One-strap backpack / KOHARU",5000,1,"bag"],["Water bottle / MAHINA",5500,1,"bottle"]
]]
];

let qty={};
const yen=n=>"¥"+n.toLocaleString("ja-JP");
function render(){
 let out="",id=0;
 sections.forEach(([title,items])=>{
   out+=`<section class="section"><h2>${title}</h2><p>${title.startsWith("今回")?"⚠️ 各商品1点まで":"商品ごとの購入上限を金額横に表示"}</p><div class="grid">`;
   items.forEach(([name,price,max,icon])=>{
     const k=id++;
     out+=`<article class="item"><div class="art"><svg viewBox="0 0 100 100" aria-hidden="true">${icons[icon]}</svg></div><div><div class="name">${name}</div><div class="price">${yen(price)} <span class="limit">⚠️${max}点まで</span></div><div class="controls"><button onclick="change(${k},-1,${max})">−</button><span class="qty" id="q${k}">0</span><button onclick="change(${k},1,${max})">＋</button></div></div></article>`;
     qty[k]??=0;
   });
   out+="</div></section>";
 });
 document.getElementById("app").innerHTML=out; updateTotal();
}
function flat(){return sections.flatMap(s=>s[1])}
function change(k,d,max){qty[k]=Math.max(0,Math.min(max,(qty[k]||0)+d));document.getElementById("q"+k).textContent=qty[k];updateTotal()}
function updateTotal(){const a=flat();let t=0;a.forEach((x,i)=>t+=x[1]*(qty[i]||0));document.getElementById("total").textContent=yen(t)}
function resetAll(){Object.keys(qty).forEach(k=>qty[k]=0);render()}
render();
</script></body></html>
