<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HANA GOODS 購入金額チェッカー</title>
<style>
:root{--bg:#ffffff;--ink:#18151c;--dark:#17141b;--purple:#9b3f99;--pink:#e59abb;--red:#b82b3d;--line:#ded8e0}
*{box-sizing:border-box} body{margin:0;background:#f8f6f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);padding-bottom:100px}
header{background:#17141b;color:white;border-bottom:0;padding:25px 20px 20px;position:sticky;top:0;z-index:4}
.kicker{color:#dda0d0;font-weight:900;letter-spacing:.25em;font-size:13px}.title{font-size:27px;font-weight:900;margin:7px 0 5px}.sub{color:#c8c2ca;font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.tab,.clear{border:2px solid #5c5660;background:#211e25;color:white;border-radius:16px;padding:12px 4px;font-weight:800;font-size:14px}.tab.active{background:#9b3f99;color:#fff;border-color:#bd66b6}.clear{width:100%;margin-top:10px;background:#211e25;color:white;border-color:#5c5660}
main{padding:20px 14px}.section-title{font-size:22px;font-weight:900;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(46,23,50,.07);border:0;display:flex;flex-direction:column}.art{height:118px;background:linear-gradient(145deg,#fbf8fc,#f3eef5);display:flex;align-items:center;justify-content:center;padding:12px}.art svg{width:88px;height:88px}
.info{padding:14px;display:flex;flex-direction:column;flex:1}.name{font-weight:900;font-size:15px;line-height:1.35;min-height:42px}.price-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:9px 0}.price{font-size:25px;font-weight:950}.limit{font-size:11px;font-weight:900;color:#a61e34;background:#fff0f2;border:1px solid #f0b7c0;border-radius:999px;padding:4px 7px}.qty{display:grid;grid-template-columns:1fr 1.5fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:auto}.qty button{border:0;background:#f1eef2;font-size:27px;font-weight:800;height:48px}.qty span{display:grid;place-items:center;font-size:21px;font-weight:900;background:white}
.badge{position:absolute;margin:10px;background:#b92d43;color:#fff;border-radius:9px;padding:5px 8px;font-size:10px;font-weight:900}.card{position:relative}
footer{position:fixed;bottom:0;left:0;right:0;background:#1c1920eF;backdrop-filter:blur(12px);color:#fff;padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;z-index:5}.selected small{color:#aaa}.selected b{font-size:23px}.total{font-size:36px;font-weight:950}
.note{margin:18px 2px 0;background:#fff8f8;border:1px solid #efdddd;padding:13px;border-radius:14px;font-size:12px;line-height:1.65}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)} main{max-width:950px;margin:auto}}
</style>

<style>
/* 注意事項：スマホでも読みやすく */
.notice, .notes, .note, .attention, .caution {
  font-size: 14px !important;
  line-height: 1.7 !important;
  color: #2b2630 !important;
  background: #fff !important;
  border: 1px solid #e7dce8 !important;
  border-left: 5px solid #9b3f99 !important;
  border-radius: 14px !important;
  padding: 14px 16px !important;
  margin: 16px 0 110px !important;
  font-weight: 600 !important;
}
.notice strong, .notes strong, .note strong, .attention strong, .caution strong {
  color: #7f287e !important;
  font-size: 15px !important;
}
@media (max-width:600px){
  .notice, .notes, .note, .attention, .caution {
    font-size: 13px !important;
    line-height: 1.75 !important;
    padding: 13px 14px !important;
  }

</style>
</head>
<body>

<div class="tabs"><button class="tab active" data-filter="all">すべて</button><button class="tab" data-filter="old">前回グッズ</button><button class="tab" data-filter="new">追加グッズ NEW</button></div>

<div class="note"><strong>⚠️ 購入数について</strong><br>
ペンライト：1点まで ／ フォトカード：10点まで ／ その他の通常グッズ：各3点まで<br>
Members’ Collectionのみ販売期間によって1点→3点に変わります。<br><br>
<span style="color:#6d6670;font-weight:500">※先行販売：9/7より順次発送予定 ／ 受注販売：11月下旬より順次発送予定<br>
※購入時は公式販売ページの最新情報をご確認ください。<br>
※イラストは商品を見分けやすくするためのオリジナル簡易アイコンです。</span></div>
</main>
<footer><div class="selected"><small>SELECTED</small><br><b><span id="count">0</span>点</b></div><div class="total" id="total">¥0</div></footer>

function japanNow(){
  // Format current instant in Asia/Tokyo, then rebuild as a comparison-friendly local timestamp.
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const v=Object.fromEntries(parts.map(p=>[p.type,p.value]));
  return `${v.year}-${v.month}-${v.day}T${v.hour}:${v.minute}:${v.second}`;
}
function memberLimit(){
  const now=japanNow();
  // Quantity-limited EC presale
  if(now>="2026-08-29T20:00:00" && now<="2026-08-30T23:59:59") return 1;

  if(now>="2026-08-31T20:00:00" && now<="2026-09-04T23:59:59"){
