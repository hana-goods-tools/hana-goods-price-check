<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>HANA Born to Bloom GOODS CALCULATOR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding-bottom:105px}
header{padding:24px 17px 17px;background:#181818;position:sticky;top:0;z-index:5;border-bottom:1px solid #333}
.kicker{font-size:11px;letter-spacing:.18em;color:#ff5268;font-weight:900}
h1{font-size:22px;margin:5px 0 4px}
.sub{font-size:12px;color:#aaa}
button{margin-top:11px;border:1px solid #555;background:#242424;color:#fff;border-radius:999px;padding:7px 13px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:12px}
.card{background:#1b1b1b;border-radius:17px;overflow:hidden;position:relative;display:block}
.card input{position:absolute;opacity:0}
.visual{height:115px;background:linear-gradient(145deg,#ddd,#aaa);display:flex;align-items:center;justify-content:center;font-size:48px;position:relative}
.check{position:absolute;right:9px;top:9px;width:30px;height:30px;border-radius:50%;background:#eee;color:transparent;display:flex;align-items:center;justify-content:center;font-weight:900}
.card:has(input:checked){outline:3px solid #ff3f58}
.card input:checked + .visual .check{background:#ff3f58;color:#fff}
.body{padding:11px 12px 13px}
.name{font-size:13px;font-weight:800;line-height:1.4;min-height:54px}
.price{font-size:20px;color:#bbb;font-weight:900;margin-top:5px}
.total{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#090909f2;padding:13px 18px calc(13px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;border-top:1px solid #333;backdrop-filter:blur(12px)}
.total small{display:block;color:#999;font-size:10px;letter-spacing:.1em}
#count{font-weight:800} #sum{font-size:29px;font-weight:950}
.note{font-size:11px;color:#777;padding:2px 14px 16px;line-height:1.5}
</style>
</head>

<div class="note">※非公式の購入金額計算ツールです。商品情報・価格は変更される場合があります。</div>
<footer class="total"><div><small>SELECTED</small><span id="count">0 items</span></div><div id="sum">¥0</div></footer>
<script>
const boxes=[...document.querySelectorAll('input[type=checkbox]')];
function calc(){
 const s=boxes.filter(x=>x.checked);
 document.getElementById('count').textContent=s.length+' items';
 document.getElementById('sum').textContent='¥'+s.reduce((a,x)=>a+Number(x.dataset.price),0).toLocaleString('ja-JP');
}
boxes.forEach(x=>x.addEventListener('change',calc));
document.getElementById('clear').onclick=()=>{boxes.forEach(x=>x.checked=false);calc();};
calc();
</script>
